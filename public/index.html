<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>D-TECH API-Fier</title>
    <style>
        body {
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #7b2cbf;
            text-shadow: 0 0 10px #7b2cbf;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        #status {
            color: #00ff00;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .log-container {
            width: 100%;
            height: 80vh;
            overflow-y: scroll;
            background: #0a0a10;
            border: 1px solid #7b2cbf;
            padding: 10px;
            box-shadow: 0 0 15px rgba(123, 44, 191, 0.2);
        }
        .log-entry {
            border-bottom: 1px solid #333;
            padding: 5px 0;
            display: flex;
            gap: 15px;
        }
        .method { color: #ff9100; font-weight: bold; width: 60px;}
        .type { color: #00bcd4; width: 100px; font-size: 0.9em;}
        .url { color: #ffffff; word-break: break-all;}
    </style>
</head>
<body>
    <h1>D-TECH // API-FIER PROXY</h1>
    <div id="status">Connecting to Proxy Node...</div>
    <div class="log-container" id="logs"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const logContainer = document.getElementById('logs');
        const statusDiv = document.getElementById('status');
        socket.on('connect', () => {
            statusDiv.innerText = ">> SYSTEM ONLINE // LISTENING FOR TRAFFIC";
            statusDiv.style.color = "#00ff00";
        });
        socket.on('log', (data) => {
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `<span class="type">[${data.type}]</span><span class="method">${data.method}</span><span class="url">${data.url}</span>`;
            logContainer.prepend(div);
        });
    </script>
</body>
</html>
