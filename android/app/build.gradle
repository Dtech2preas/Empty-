plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dtech.proxybrowser'
    compileSdk 34

    defaultConfig {
        applicationId "com.dtech.proxybrowser"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

task npmInstall(type: Exec) {
    workingDir 'node_assets/nodejs-project'
    commandLine 'npm', 'install', '--production'
}

task packageNodeAssets(type: Zip) {
    dependsOn npmInstall
    from 'node_assets'
    archiveFileName = 'env.zip'
    destinationDirectory = file('src/main/assets')
}

preBuild.dependsOn packageNodeAssets

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
